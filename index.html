<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>A Little Surprise for Harshithaa 💖</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0b0620; --deep:#1a0b3d; --purple:#4b1d8f; --violet:#7c4dff;
  --pink:#ff4fa3; --rose:#ff9ad0; --wine:#c2185b; --gold:#ffd166;
  --script:'Great Vibes','Brush Script MT','Segoe Script',cursive;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0;height:100%;background:var(--midnight);color:#fff;font-family:var(--sans);overflow:hidden}
button{font-family:inherit}

/* ---------- Background layers (never catch taps) ---------- */
#bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(124,77,255,.38), transparent 55%),
    radial-gradient(ellipse at 85% 92%, rgba(194,24,91,.38), transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(75,29,143,.30), transparent 70%),
    linear-gradient(160deg,#0b0620 0%,#1a0b3d 50%,#2a0a3a 100%);}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.2;animation:twinkle 3s ease-in-out infinite}
#hearts{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;overflow:hidden}
.fh{position:absolute;bottom:-40px;color:var(--pink);text-shadow:0 0 12px rgba(255,79,163,.9);opacity:0;animation:floatUp linear forwards}
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;z-index:30;pointer-events:none}

/* ---------- Screens ---------- */
.screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;display:flex;
  padding:max(70px,calc(env(safe-area-inset-top) + 62px)) 18px max(24px,env(safe-area-inset-bottom));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .6s ease, visibility 0s linear .6s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .6s ease, visibility 0s linear 0s}
.inner{margin:auto;width:100%;max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center}

.title{font-family:var(--script);font-weight:400;font-size:clamp(2.2rem,10vw,3.6rem);line-height:1.15;margin:10px 0 8px;
  background:linear-gradient(90deg,#ffd0e8,#ff7eb9,#c9a7ff,#ff7eb9,#ffd0e8);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,79,163,.55));animation:shimmer 6s linear infinite}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,4.6vw,1.45rem);color:#f3d9ff;margin:0 0 28px;opacity:.95}

/* ---------- Buttons ---------- */
.btn{font-weight:600;letter-spacing:.3px;color:#fff;border:0;border-radius:999px;padding:18px 34px;min-height:60px;font-size:1.1rem;cursor:pointer;
  background:linear-gradient(135deg,#ff4fa3,#c2185b 55%,#7c4dff);
  box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 10px 30px rgba(255,79,163,.45),0 0 40px rgba(124,77,255,.35);
  animation:pulse 2.2s ease-in-out infinite;touch-action:manipulation;position:relative}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.big{width:min(92vw,420px);font-size:1.2rem;padding:22px 26px;min-height:68px}
.btn.soft{background:rgba(255,255,255,.1);box-shadow:0 0 0 1px rgba(255,255,255,.28) inset,0 6px 20px rgba(124,77,255,.3);animation:none}
.btn[disabled]{opacity:.35;cursor:default;box-shadow:none;animation:none}
.btn.nudge{animation:nudge .7s ease 2}

/* ---------- Screen 1: opening ---------- */
.heartwrap{position:relative;width:min(56vw,230px);height:min(56vw,230px);margin:0 auto 8px;pointer-events:none}
.heartwrap svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 22px rgba(255,79,163,.95)) drop-shadow(0 0 60px rgba(194,24,91,.7));animation:beat 1.4s ease-in-out infinite;transform-origin:50% 55%}
.spark{position:absolute;color:#ffe6f4;text-shadow:0 0 10px #ff9ad0,0 0 20px #ff4fa3;animation:spark 2.4s ease-in-out infinite;pointer-events:none}
.spark.a{top:2%;left:4%;font-size:22px}.spark.b{top:12%;right:0;font-size:16px;animation-delay:.6s}
.spark.c{bottom:10%;left:-4%;font-size:14px;animation-delay:1.1s}.spark.d{bottom:2%;right:6%;font-size:24px;animation-delay:1.7s}

/* ---------- Screen 2: message ---------- */
.card{width:100%;padding:30px 22px 26px;border-radius:26px;background:rgba(255,255,255,.07);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,154,208,.35);box-shadow:0 0 40px rgba(255,79,163,.25),0 0 90px rgba(124,77,255,.2)}
.card h2{font-family:var(--script);font-weight:400;font-size:clamp(2.1rem,9.5vw,3.2rem);margin:0 0 14px;color:#ffd0e8;text-shadow:0 0 18px rgba(255,79,163,.8)}
.line{font-family:var(--serif);font-weight:500;font-size:clamp(1.12rem,4.5vw,1.4rem);line-height:1.55;color:#f6e6ff;margin:0 0 12px;opacity:0}
.screen.active .line{animation:rise .9s ease forwards}
.sig{font-family:var(--script);font-size:clamp(1.8rem,8vw,2.4rem);color:#ff9ad0;margin:10px 0 22px;text-shadow:0 0 14px rgba(255,79,163,.7);opacity:0}
.screen.active .sig{animation:rise .9s ease forwards}

/* ---------- Screen 3: gallery ---------- */
.gal h2{font-family:var(--script);font-weight:400;font-size:clamp(2rem,9vw,2.8rem);margin:0 0 10px;color:#ffd0e8;text-shadow:0 0 16px rgba(255,79,163,.8)}
.frame{position:relative;width:min(90vw,520px);height:55vh;height:min(58vh,560px);border-radius:22px;padding:8px;cursor:pointer;
  background:linear-gradient(135deg,#ff4fa3,#7c4dff,#ff9ad0);
  box-shadow:0 0 28px rgba(255,79,163,.7),0 0 70px rgba(124,77,255,.55)}
.photobox{position:relative;width:100%;height:100%;border-radius:15px;overflow:hidden;background:#12082e;display:flex;align-items:center;justify-content:center}
.photo{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.fadein{animation:fadeIn .8s ease both}
.fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% 40%,rgba(255,79,163,.35),rgba(18,8,46,1) 70%)}
.fallback .fh2{font-size:64px;color:var(--pink);text-shadow:0 0 24px #ff4fa3;animation:beat 1.4s ease-in-out infinite}
.fallback p{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:#f6e6ff;margin:8px 0 4px}
.fallback small{color:#c9a7ff;font-size:.75rem}
.counter{position:absolute;top:14px;right:16px;font-size:.78rem;padding:4px 10px;border-radius:999px;background:rgba(11,6,32,.7);color:#ffd0e8;z-index:2;pointer-events:none}
.quote{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.1rem,4.5vw,1.4rem);line-height:1.45;color:#f6e6ff;margin:16px 6px 6px;min-height:3.4em;max-width:520px;text-shadow:0 0 12px rgba(255,79,163,.5)}
.dots{display:flex;justify-content:center;margin:6px 0 14px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);margin:0 4px;transition:all .3s}
.dot.on{background:var(--pink);box-shadow:0 0 10px var(--pink);transform:scale(1.35)}
.navrow{display:flex;justify-content:center;flex-wrap:wrap}
.navrow .btn{margin:6px 8px;padding:15px 24px;min-height:54px;font-size:1rem;min-width:140px}

/* ---------- Screen 4: finale ---------- */
.stage{width:100%;display:flex;flex-direction:column;align-items:center}
.scene{display:flex;align-items:flex-end;justify-content:center;position:relative;min-height:190px;width:100%}
.doorwrap{opacity:0;transform:scale(.6) translateY(24px);transition:all .9s cubic-bezier(.34,1.56,.64,1);position:relative}
.stage.s1 .doorwrap{opacity:1;transform:none}
.doorframe{position:relative;width:118px;height:172px;border:7px solid #7a3b8f;border-bottom-width:4px;border-radius:62px 62px 4px 4px;
  background:radial-gradient(circle at 50% 70%,#fff6c2,#ffb86b 70%);box-shadow:0 0 26px rgba(255,209,102,.55),0 0 60px rgba(255,79,163,.35)}
.door{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:54px 54px 0 0;transform-origin:left center;
  background:linear-gradient(160deg,#ff7eb9,#c2185b);transition:transform 1.1s cubic-bezier(.5,0,.2,1);box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
.door:after{content:"♥";position:absolute;top:30%;left:0;width:100%;text-align:center;color:#ffd0e8;font-size:30px;text-shadow:0 0 12px #fff}
.door .knob{position:absolute;right:12px;top:58%;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.door.open{transform:perspective(520px) rotateY(-112deg)}
.door.shake{animation:shake .22s ease 3}
.knocktext{position:absolute;top:-6px;left:50%;transform:translateX(-50%) scale(.6);padding:6px 14px;border-radius:999px;background:#fff;color:#c2185b;font-weight:600;font-size:.85rem;opacity:0;white-space:nowrap;transition:all .3s}
.knocktext.show{opacity:1;transform:translateX(-50%) scale(1)}
.visitor{width:92px;margin-right:14px;opacity:0;transform:translateX(-130px);transition:all 1s cubic-bezier(.34,1.3,.64,1)}
.visitor.in{opacity:1;transform:none}
.visitor svg{width:100%;height:auto;overflow:visible;display:block}
.visitor .arm{transform-origin:70px 78px}
.visitor.knocking .arm{animation:knockArm .3s ease-in-out 4}
.cats{display:flex;justify-content:center;width:100%;margin-top:14px}
.catw{position:relative;width:22vw;max-width:112px;margin:0 2px;opacity:0;transform:translateY(-46px) scale(.3);transition:all .7s cubic-bezier(.34,1.56,.64,1)}
.catw.in{opacity:1;transform:none}
.catw svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.catw .bob{animation:bob 1.6s ease-in-out infinite}
.item{position:absolute;left:50%;bottom:-6px;font-size:clamp(26px,8vw,38px);transform:translateX(-50%) rotate(-12deg);line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.item.balloon{bottom:auto;top:-26px;left:78%;font-size:clamp(30px,9vw,44px);transform:translateX(-50%);animation:floaty 2.2s ease-in-out infinite}
.hbd{font-family:var(--script);font-weight:400;font-size:clamp(2.3rem,11vw,4rem);line-height:1.1;margin:22px 0 8px;opacity:0;transform:scale(.7);transition:all 1s cubic-bezier(.34,1.56,.64,1);
  background:linear-gradient(90deg,#fff,#ffd0e8,#ff7eb9,#c9a7ff,#ffd0e8,#fff);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,79,163,.8));animation:shimmer 5s linear infinite}
.hbd.show{opacity:1;transform:none}
.hbdsub{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,4.6vw,1.4rem);color:#f3d9ff;margin:0 0 18px;opacity:0;transition:opacity 1s ease}
.hbdsub.show{opacity:1}
.love{font-family:var(--script);font-size:clamp(2rem,9.5vw,3rem);line-height:1.2;margin:0 0 22px;color:#ffd0e8;opacity:0;transform:scale(.8);
  text-shadow:0 0 14px #ff4fa3,0 0 34px rgba(255,79,163,.8);transition:all 1.2s cubic-bezier(.34,1.56,.64,1)}
.love.show{opacity:1;transform:none;animation:beat 1.6s ease-in-out 1.2s infinite}
.from{font-family:var(--script);font-size:clamp(1.7rem,8vw,2.4rem);line-height:1.2;margin:-8px 0 22px;color:#ff9ad0;opacity:0;
  text-shadow:0 0 12px rgba(255,79,163,.8);transition:opacity 1.2s ease}
.from.show{opacity:1}
#replayBtn{opacity:0;visibility:hidden;transition:opacity .8s}
#replayBtn.show{opacity:1;visibility:visible}

/* ---------- Music bar ---------- */
#musicbar{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:20;display:flex;align-items:center;padding:5px;border-radius:999px;
  background:rgba(20,8,48,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,154,208,.4);box-shadow:0 0 18px rgba(255,79,163,.35)}
#musicbar button{border:0;color:#fff;background:rgba(255,255,255,.1);border-radius:999px;min-height:42px;min-width:42px;padding:0 12px;font-size:.88rem;font-weight:600;cursor:pointer;touch-action:manipulation;margin:0 2px}
#musicbar button:active{background:rgba(255,79,163,.5)}
#musicbar button:focus-visible{outline:2px solid #fff}
#volLabel{font-size:.78rem;min-width:46px;text-align:center;color:#ffd0e8}
noscript{position:fixed;z-index:50;top:0;left:0;right:0;padding:14px;background:#c2185b;color:#fff;text-align:center}

/* ---------- Keyframes ---------- */
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.25)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) rotate(-8deg)}10%{opacity:.85}100%{opacity:0;transform:translateY(-110vh) rotate(14deg)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}70%{transform:scale(1)}}
@keyframes spark{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(25deg)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 10px 30px rgba(255,79,163,.45),0 0 40px rgba(124,77,255,.35)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 12px 44px rgba(255,79,163,.85),0 0 70px rgba(124,77,255,.6)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:none}30%{transform:scale(1.08)}60%{transform:scale(.96)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes floaty{0%,100%{transform:translate(-50%,0) rotate(-5deg)}50%{transform:translate(-50%,-9px) rotate(5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes knockArm{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (max-height:560px){ .frame{height:70vh} .screen{padding-top:60px} }
</style>
</head>
<body>
<noscript>This surprise needs JavaScript turned on. Please open it in Chrome or Safari. 💖</noscript>

<div id="bg" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div id="musicbar" hidden>
  <button id="musicBtn" type="button" aria-label="Turn music on or off">🔊 Music ON</button>
  <button id="volDown" type="button" aria-label="Volume down">−</button>
  <span id="volLabel" aria-live="polite">Vol 7</span>
  <button id="volUp" type="button" aria-label="Volume up">+</button>
</div>

<main>
  <!-- SCREEN 1 -->
  <section id="s-open" class="screen active">
    <div class="inner">
      <div class="heartwrap">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9ad0"/><stop offset=".5" stop-color="#ff4fa3"/><stop offset="1" stop-color="#c2185b"/>
            </linearGradient>
          </defs>
          <path d="M50 90 C8 60 0 32 19 15 C33 3 47 11 50 24 C53 11 67 3 81 15 C100 32 92 60 50 90 Z" fill="url(#hg)"/>
          <path d="M26 24 C30 18 38 17 42 22" stroke="rgba(255,255,255,.7)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="spark a">✦</span><span class="spark b">✦</span><span class="spark c">✦</span><span class="spark d">✦</span>
      </div>
      <h1 class="title">A Little Surprise for You, Harshithaa ❤️</h1>
      <p class="sub">Something special is waiting for you…</p>
      <button id="openBtn" class="btn big" type="button">Tap to Open Your Surprise 💖</button>
    </div>
  </section>

  <!-- SCREEN 2 -->
  <section id="s-message" class="screen">
    <div class="inner">
      <div class="card">
        <h2 id="msgTitle"></h2>
        <div id="msgLines"></div>
        <div class="sig" id="msgSig"></div>
        <button id="continueBtn" class="btn" type="button">Continue 💞</button>
      </div>
    </div>
  </section>

  <!-- SCREEN 3 -->
  <section id="s-gallery" class="screen">
    <div class="inner gal">
      <h2>Our Beautiful Memories 💞</h2>
      <div class="frame" id="frame" title="Tap for the next photo">
        <div class="counter" id="counter"></div>
        <div class="photobox" id="photoBox"></div>
      </div>
      <p class="quote" id="quote"></p>
      <div class="dots" id="dots"></div>
      <div class="navrow">
        <button id="prevBtn" class="btn soft" type="button">◀ Previous</button>
        <button id="nextBtn" class="btn" type="button">Next ▶</button>
      </div>
    </div>
  </section>

  <!-- SCREEN 4 -->
  <section id="s-finale" class="screen">
    <div class="inner">
      <div class="stage" id="stage">
        <div class="scene">
          <div class="visitor" id="visitor">
            <svg viewBox="0 0 100 130" aria-hidden="true">
              <ellipse cx="50" cy="118" rx="30" ry="9" fill="rgba(0,0,0,.25)"/>
              <path d="M30 40 L50 4 L70 40 Z" fill="#ffd166"/><circle cx="50" cy="5" r="5" fill="#ff4fa3"/>
              <path d="M36 30 L64 30 M40 21 L60 21" stroke="#ff4fa3" stroke-width="3" stroke-linecap="round"/>
              <ellipse cx="50" cy="84" rx="30" ry="32" fill="#ff7eb9"/>
              <ellipse cx="50" cy="60" rx="27" ry="24" fill="#ffb3d9"/>
              <ellipse cx="40" cy="60" rx="4" ry="5.5" fill="#3a1a4f"/><ellipse cx="60" cy="60" rx="4" ry="5.5" fill="#3a1a4f"/>
              <circle cx="41.5" cy="58" r="1.6" fill="#fff"/><circle cx="61.5" cy="58" r="1.6" fill="#fff"/>
              <circle cx="31" cy="68" r="5" fill="#ff4fa3" opacity=".45"/><circle cx="69" cy="68" r="5" fill="#ff4fa3" opacity=".45"/>
              <path d="M43 70 Q50 77 57 70" stroke="#3a1a4f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
              <ellipse cx="38" cy="112" rx="9" ry="5" fill="#c2185b"/><ellipse cx="62" cy="112" rx="9" ry="5" fill="#c2185b"/>
              <g class="arm"><ellipse cx="82" cy="88" rx="8" ry="15" fill="#ff7eb9" transform="rotate(-18 82 88)"/><circle cx="86" cy="73" r="6" fill="#ffb3d9"/></g>
            </svg>
          </div>
          <div class="doorwrap">
            <div class="knocktext" id="knockText">Knock knock! 💕</div>
            <div class="doorframe"><div class="door" id="door"><span class="knob"></span></div></div>
          </div>
        </div>
        <div class="cats" id="cats"></div>
        <h1 class="hbd" id="hbd">Happy Birthday, Harshithaa!</h1>
        <p class="hbdsub" id="hbdSub">May every day with you feel as magical as this one 💖</p>
        <p class="love" id="loveLine">I love you, Harshithaa 💖</p>
        <p class="from" id="fromLine">Your Madhan 💖</p>
        <button id="replayBtn" class="btn" type="button">Replay the Surprise 🔁</button>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  /* ===================================================================
     EDIT YOUR TEXT HERE (everything the visitor reads is in this block)
     =================================================================== */
  var CONFIG = {
    messageTitle: 'Happy Birthday, my love 🎂',
    messageLines: [
      'Today the whole sky is lighting up for one reason: it is your birthday.',
      'Harshithaa, you bring warmth into every room you enter and magic into every day you touch.',
      'Thank you for your smile, your kindness, and for loving me the way you do.',
      'I made this little surprise just to remind you how deeply you are loved.',
      'May this year be full of laughter, dreams coming true, and all the happiness your heart can hold.'
    ],
    signature: 'Your Madhan 💖',
    photos: [
      { src: 'photo1.jpg', text: 'Some moments never fade. They glow, and you are the light in every one of them.' },
      { src: 'photo2.jpg', text: 'With you, even ordinary days feel like a celebration.' },
      { src: 'photo3.jpg', text: 'I never knew a smile could feel like home until I saw yours.' },
      { src: 'photo4.jpg', text: 'Whatever the adventure, I would choose it with you every single time.' },
      { src: 'photo5.jpg', text: 'You make my heart softer, my laughter louder, and my world brighter.' },

  /* ---------------- helpers ---------------- */

  /* ===================================================================

     =================================================================== */

  /* ===================================================================
     SCREEN 3: gallery
     =================================================================== */
  function makeFallback(i) {

    }

  }
  function nextPhoto() {

    else goTo('s-finale');
  }
  function prevPhoto() { if (photoIndex > 0) showPhoto(photoIndex - 1); }

    else {
      var nb = $('nextBtn'); nb.classList.remove('nudge'); void nb.offsetWidth; nb.classList.add('nudge');
